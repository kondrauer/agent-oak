# Story milestones of Pokemon Red, a dependency DAG checked against RAM.
#
# Each milestone:
#   id        unique name, referenced by other milestones' requires
#   label     short goal name for the status line, e.g. "Beat Misty"
#   done      predicate that is true once it is achieved (see below)
#   requires  milestone ids that must be done before this one is a goal
#   map       map constant where it happens (optional)
#   target    where on that map: { npc: NAME } (object constant, with or
#             without the map prefix), { tile: [x, y] } for position
#             triggered scripts and hidden events, or { warp: MAP } for the
#             warp leading to MAP (optional)
#   blurb     one sentence on what to do
#   readiness soft checks: min_level, ace (species) and ace_level
#   tags      main for the story path
#
# Predicates: event, badge, item, item_anywhere, visited, object_hidden,
# party_move, capability, and the combinators all, any, not. Names are
# checked against data/constants.json when loading.
#
# Every done flag was checked against the script that sets it in pokered's
# scripts/*.asm (or engine/ for hidden events), noted per milestone.

# Field moves need a badge, see .cut / .surf / ... in
# engine/menus/start_sub_menus.asm
capabilities:
  CUT: { all: [{ badge: CASCADE }, { party_move: CUT }] }
  FLY: { all: [{ badge: THUNDER }, { party_move: FLY }] }
  SURF: { all: [{ badge: SOUL }, { party_move: SURF }] }
  STRENGTH: { all: [{ badge: RAINBOW }, { party_move: STRENGTH }] }
  FLASH: { all: [{ badge: BOULDER }, { party_move: FLASH }] }

# Tiles scripts or NPCs keep the player off until 'until' holds. Routing
# treats them as closed until then and reports the blocker's id when a path
# needs them. tiles are [x, y] steps, npcs are object constants whose tile
# is blocked. NPCs that stand still are obstacles anyway, list them here
# only to explain why and when they move. opened_by is the milestone that
# opens it: routing prefers ways that open sooner, hints name it.
blockers:
  # ViridianCity.asm, ViridianCityCheckGotPokedexScript at (19, 9) sends the
  # player back, the sleeping old man (TOGGLE_LYING_OLD_MAN) lies next to it
  - id: VIRIDIAN_OLD_MAN
    map: VIRIDIAN_CITY
    opened_by: DELIVER_PARCEL
    tiles: [[19, 9]]
    npcs: [OLD_MAN_SLEEPY]
    until: { event: EVENT_GOT_POKEDEX }
    blurb: "An old man blocks the road north of Viridian City until you have a Pokedex."

  # PewterCity.asm, PewterCityPlayerLeavingEastCoords until EVENT_BEAT_BROCK
  - id: PEWTER_EAST_EXIT
    map: PEWTER_CITY
    opened_by: BEAT_BROCK
    tiles: [[35, 17], [36, 17], [37, 18], [37, 19]]
    until: { event: EVENT_BEAT_BROCK }
    blurb: "A boy drags you to Pewter Gym when you try to leave east before beating Brock."

  # BillsHouse.asm hides TOGGLE_CERULEAN_GUARD_2 with the S.S. Ticket
  - id: CERULEAN_GUARD
    map: CERULEAN_CITY
    opened_by: GET_SS_TICKET
    npcs: [GUARD2]
    until: { object_hidden: TOGGLE_CERULEAN_GUARD_2 }
    blurb: "A police officer guards the robbed house in Cerulean, he leaves once Bill gave you the S.S. Ticket."

  # VermilionCity.asm, SSAnneTicketCheckCoords: the sailor checks the bag for
  # S_S_TICKET and turns everyone away after the ship left
  - id: VERMILION_DOCK_SAILOR
    map: VERMILION_CITY
    opened_by: GET_SS_TICKET
    tiles: [[18, 30]]
    npcs: [SAILOR1]
    until: { all: [{ item: S_S_TICKET }, { not: { event: EVENT_SS_ANNE_LEFT } }] }
    blurb: "The sailor at Vermilion's dock only lets you onto the S.S. Anne with an S.S. Ticket, and not after it left."

  # VermilionGym.asm, VermilionGymSetDoorTile puts the double door block $24
  # at block (2, 2) until EVENT_2ND_LOCK_OPENED. The .blk has the open floor.
  - id: VERMILION_GYM_DOOR
    map: VERMILION_GYM
    opened_by: OPEN_SURGE_LOCKS
    tiles: [[4, 4], [5, 4], [4, 5], [5, 5]]
    until: { event: EVENT_2ND_LOCK_OPENED }
    blurb: "An electric door blocks Lt. Surge, open it with the two switches hidden in the gym's trash cans."

  # Segment 2

  # Route5Gate.asm .. Route8Gate.asm: the guard turns the player back at
  # these coords unless wStatusFlags1 has BIT_GAVE_SAFFRON_GUARDS_DRINK, or
  # RemoveGuardDrink finds one of GuardDrinksList in the bag (and sets it)
  - id: SAFFRON_GATE_NORTH
    map: ROUTE_5_GATE
    opened_by: GET_DRINK
    tiles: [[3, 3], [4, 3]]
    until: &gave_drink
      any:
        - { status_flag: GAVE_SAFFRON_GUARDS_DRINK }
        - { item: FRESH_WATER }
        - { item: SODA_POP }
        - { item: LEMONADE }
    blurb: &thirsty "The guards at the gates to Saffron City are thirsty, they let you through once you bring one a drink (Fresh Water, Soda Pop or Lemonade from the vending machines on the Celadon Mart roof)."
  - id: SAFFRON_GATE_SOUTH
    map: ROUTE_6_GATE
    opened_by: GET_DRINK
    tiles: [[3, 2], [4, 2]]
    until: *gave_drink
    blurb: *thirsty
  - id: SAFFRON_GATE_WEST
    map: ROUTE_7_GATE
    opened_by: GET_DRINK
    tiles: [[3, 3], [3, 4]]
    until: *gave_drink
    blurb: *thirsty
  - id: SAFFRON_GATE_EAST
    map: ROUTE_8_GATE
    opened_by: GET_DRINK
    tiles: [[2, 3], [2, 4]]
    until: *gave_drink
    blurb: *thirsty

  # GameCorner.asm hides TOGGLE_GAME_CORNER_ROCKET after his battle, he
  # stands in front of the poster
  - id: GAME_CORNER_ROCKET
    map: GAME_CORNER
    opened_by: BEAT_GAME_CORNER_ROCKET
    npcs: [ROCKET]
    until: { object_hidden: TOGGLE_GAME_CORNER_ROCKET }
    blurb: "A Team Rocket grunt guards a poster in the Game Corner, talk to him to battle."

  # GameCorner.asm puts the poster wall block $2a at block (8, 2) until
  # EVENT_FOUND_ROCKET_HIDEOUT, the .blk has the stairs ($43)
  - id: GAME_CORNER_STAIRS
    map: GAME_CORNER
    opened_by: FIND_ROCKET_HIDEOUT
    tiles: [[16, 4], [17, 4], [16, 5], [17, 5]]
    until: { event: EVENT_FOUND_ROCKET_HIDEOUT }
    blurb: "The stairs to the Rocket Hideout are hidden until you press the switch behind the poster in the Game Corner."

  # RocketHideoutElevator.asm checks the bag for LIFT_KEY
  - id: ROCKET_HIDEOUT_LIFT
    map: ROCKET_HIDEOUT_ELEVATOR
    opened_by: GET_LIFT_KEY
    tiles: [[2, 1], [3, 1]]
    until: { item: LIFT_KEY }
    blurb: "The Rocket Hideout's elevator needs the Lift Key, a grunt on B4F drops it."

  # RocketHideoutB4F.asm, RocketHideoutB4FDoorCallbackScript: door block $2d
  # at block (12, 5) until both guards are beaten, the .blk has the floor
  - id: ROCKET_HIDEOUT_B4F_DOOR
    map: ROCKET_HIDEOUT_B4F
    opened_by: BEAT_HIDEOUT_GIOVANNI
    tiles: [[24, 10], [25, 10], [24, 11], [25, 11]]
    until:
      any:
        - { event: EVENT_ROCKET_HIDEOUT_4_DOOR_UNLOCKED }
        - all:
            - { event: EVENT_BEAT_ROCKET_HIDEOUT_4_TRAINER_0 }
            - { event: EVENT_BEAT_ROCKET_HIDEOUT_4_TRAINER_1 }
    blurb: "Giovanni's door on Rocket Hideout B4F opens once you beat the two grunts guarding it."

  # PokemonTower6F.asm, the ghost battle at (10, 16) can only be won with
  # the Silph Scope (engine/battle/core.asm checks the bag for it)
  - id: POKEMON_TOWER_GHOST
    map: POKEMON_TOWER_6F
    opened_by: BEAT_MAROWAK_GHOST
    tiles: [[10, 16]]
    until: { event: EVENT_BEAT_GHOST_MAROWAK }
    blurb: "A ghost blocks the stairs to the top of Pokemon Tower, you need the Silph Scope to see through it."

  # Segment 3

  # Route12.asm / Route16.asm hide the Snorlax after the battle the Poke
  # Flute starts
  - id: ROUTE_12_SNORLAX
    map: ROUTE_12
    opened_by: WAKE_SNORLAX
    npcs: [SNORLAX]
    until: { object_hidden: TOGGLE_ROUTE_12_SNORLAX }
    blurb: "A sleeping Snorlax blocks Route 12 south of Lavender, wake it with the Poke Flute."
  - id: ROUTE_16_SNORLAX
    map: ROUTE_16
    opened_by: WAKE_SNORLAX
    npcs: [SNORLAX]
    until: { object_hidden: TOGGLE_ROUTE_16_SNORLAX }
    blurb: "A sleeping Snorlax blocks Route 16 west of Celadon, wake it with the Poke Flute."

  # Route16Gate1F.asm / Route18Gate1F.asm turn the player back at these
  # coords without a BICYCLE in the bag
  - id: CYCLING_ROAD_NORTH
    map: ROUTE_16_GATE_1F
    tiles: [[4, 7], [4, 8], [4, 9], [4, 10]]
    until: { item: BICYCLE }
    blurb: &bike "Cycling Road is for bikes only, get the Bicycle from the Bike Shop in Cerulean with the Bike Voucher."
  - id: CYCLING_ROAD_SOUTH
    map: ROUTE_18_GATE_1F
    tiles: [[4, 3], [4, 4], [4, 5], [4, 6]]
    until: { item: BICYCLE }
    blurb: *bike

  # PokemonTower7F.asm hides TOGGLE_SAFFRON_CITY_E (ROCKET8, in front of
  # Silph Co's door) when Mr. Fuji is rescued
  - id: SILPH_CO_ENTRANCE
    map: SAFFRON_CITY
    opened_by: RESCUE_MR_FUJI
    npcs: [ROCKET8]
    until: { object_hidden: TOGGLE_SAFFRON_CITY_E }
    blurb: "A Team Rocket grunt blocks Silph Co's door until you rescued Mr. Fuji in Pokemon Tower."

  # SilphCo11F.asm hides TOGGLE_SAFFRON_CITY_1-7 when Giovanni is beaten,
  # ROCKET3 stands in front of the gym's door
  - id: SAFFRON_GYM_ROCKET
    map: SAFFRON_CITY
    opened_by: BEAT_SILPH_GIOVANNI
    npcs: [ROCKET3]
    until: { object_hidden: TOGGLE_SAFFRON_CITY_3 }
    blurb: "A Team Rocket grunt blocks Saffron Gym until you beat Giovanni at the top of Silph Co."

  # SilphCo<N>F.asm GateCallbackScript: a door block at each `lb bc, y, x`
  # until its EVENT_SILPH_CO_<N>_UNLOCKED_DOOR<k>, walking into it with the
  # CARD_KEY in the bag unlocks it. The .blk files have the doors open.
  - id: SILPH_CO_2F_DOORS
    map: SILPH_CO_2F
    opened_by: GET_CARD_KEY
    tiles: [[4, 4], [5, 4], [4, 5], [5, 5], [4, 10], [5, 10], [4, 11], [5, 11]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_2_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_2_UNLOCKED_DOOR2 }
    blurb: &card_key "Silph Co's locked doors open with the Card Key from 5F."

  - id: SILPH_CO_3F_DOORS
    map: SILPH_CO_3F
    opened_by: GET_CARD_KEY
    tiles: [[8, 8], [9, 8], [8, 9], [9, 9], [16, 8], [17, 8], [16, 9], [17, 9]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_3_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_3_UNLOCKED_DOOR2 }
    blurb: *card_key

  - id: SILPH_CO_4F_DOORS
    map: SILPH_CO_4F
    opened_by: GET_CARD_KEY
    tiles: [[4, 12], [5, 12], [4, 13], [5, 13], [12, 8], [13, 8], [12, 9], [13, 9]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_4_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_4_UNLOCKED_DOOR2 }
    blurb: *card_key

  - id: SILPH_CO_5F_DOORS
    map: SILPH_CO_5F
    opened_by: GET_CARD_KEY
    tiles: [[6, 4], [7, 4], [6, 5], [7, 5], [6, 12], [7, 12], [6, 13], [7, 13], [14, 10], [15, 10], [14, 11], [15, 11]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_5_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_5_UNLOCKED_DOOR2 }
            - { event: EVENT_SILPH_CO_5_UNLOCKED_DOOR3 }
    blurb: *card_key

  - id: SILPH_CO_6F_DOORS
    map: SILPH_CO_6F
    opened_by: GET_CARD_KEY
    tiles: [[4, 12], [5, 12], [4, 13], [5, 13]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_6_UNLOCKED_DOOR }
    blurb: *card_key

  - id: SILPH_CO_7F_DOORS
    map: SILPH_CO_7F
    opened_by: GET_CARD_KEY
    tiles: [[10, 6], [11, 6], [10, 7], [11, 7], [20, 4], [21, 4], [20, 5], [21, 5], [20, 12], [21, 12], [20, 13], [21, 13]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_7_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_7_UNLOCKED_DOOR2 }
            - { event: EVENT_SILPH_CO_7_UNLOCKED_DOOR3 }
    blurb: *card_key

  - id: SILPH_CO_8F_DOORS
    map: SILPH_CO_8F
    opened_by: GET_CARD_KEY
    tiles: [[6, 8], [7, 8], [6, 9], [7, 9]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_8_UNLOCKED_DOOR }
    blurb: *card_key

  - id: SILPH_CO_9F_DOORS
    map: SILPH_CO_9F
    opened_by: GET_CARD_KEY
    tiles: [[2, 8], [3, 8], [2, 9], [3, 9], [18, 4], [19, 4], [18, 5], [19, 5], [18, 10], [19, 10], [18, 11], [19, 11], [10, 12], [11, 12], [10, 13], [11, 13]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_9_UNLOCKED_DOOR1 }
            - { event: EVENT_SILPH_CO_9_UNLOCKED_DOOR2 }
            - { event: EVENT_SILPH_CO_9_UNLOCKED_DOOR3 }
            - { event: EVENT_SILPH_CO_9_UNLOCKED_DOOR4 }
    blurb: *card_key

  - id: SILPH_CO_10F_DOORS
    map: SILPH_CO_10F
    opened_by: GET_CARD_KEY
    tiles: [[10, 8], [11, 8], [10, 9], [11, 9]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_10_UNLOCKED_DOOR }
    blurb: *card_key

  - id: SILPH_CO_11F_DOORS
    map: SILPH_CO_11F
    opened_by: GET_CARD_KEY
    tiles: [[6, 12], [7, 12], [6, 13], [7, 13]]
    until:
      any:
        - { item: CARD_KEY }
        - all:
            - { event: EVENT_SILPH_CO_11_UNLOCKED_DOOR }
    blurb: *card_key

milestones:
  # Segment 1: Pallet Town to the Thunder Badge

  # OaksLab.asm, set when Oak leads the player in. The trigger is
  # PalletTown.asm: wYCoord 1 at the north exit.
  - id: MEET_OAK
    label: Meet Prof. Oak
    done: { event: EVENT_FOLLOWED_OAK_INTO_LAB }
    map: PALLET_TOWN
    target: { tile: [10, 1] }
    blurb: "Try to leave Pallet Town north into the tall grass, Prof. Oak will stop you."
    tags: [main]

  # OaksLab.asm
  - id: GET_STARTER
    label: Choose a starter
    done: { event: EVENT_GOT_STARTER }
    requires: [MEET_OAK]
    map: OAKS_LAB
    target: { npc: SQUIRTLE_POKE_BALL }
    blurb: "Pick one of the three Poke Balls on Oak's table as your first Pokemon."
    tags: [main]

  # OaksLab.asm, the rival stops you on the way out
  - id: BATTLE_RIVAL_LAB
    label: Battle the rival
    done: { event: EVENT_BATTLED_RIVAL_IN_OAKS_LAB }
    requires: [GET_STARTER]
    map: OAKS_LAB
    target: { npc: RIVAL }
    blurb: "Your rival challenges you as you try to leave Oak's lab. Win or lose, the story goes on."
    tags: [main]

  # ViridianMart.asm, the clerk hands it over when you enter
  - id: GET_OAKS_PARCEL
    label: Get Oak's Parcel
    done: { event: EVENT_GOT_OAKS_PARCEL }
    requires: [BATTLE_RIVAL_LAB]
    map: VIRIDIAN_MART
    target: { npc: CLERK }
    blurb: "Go north to Viridian City, the Poke Mart clerk has a parcel for Prof. Oak."
    tags: [main]

  # OaksLab.asm sets both flags together when Oak takes the parcel
  - id: DELIVER_PARCEL
    label: Deliver the parcel
    done: { all: [{ event: EVENT_OAK_GOT_PARCEL }, { event: EVENT_GOT_POKEDEX }] }
    requires: [GET_OAKS_PARCEL]
    map: OAKS_LAB
    target: { npc: OAK1 }
    blurb: "Bring the parcel back to Prof. Oak in Pallet Town, he gives you a Pokedex."
    tags: [main]

  # ViridianCity.asm: the old man blocks the north exit until EVENT_GOT_POKEDEX
  - id: REACH_PEWTER
    label: Reach Pewter City
    done: { visited: PEWTER_CITY }
    requires: [DELIVER_PARCEL]
    map: PEWTER_CITY
    blurb: "Head north from Viridian City through Viridian Forest to Pewter City."
    tags: [main]

  # PewterGym.asm
  - id: BEAT_BROCK
    label: Beat Brock
    done: { badge: BOULDER }
    requires: [REACH_PEWTER]
    map: PEWTER_GYM
    target: { npc: BROCK }
    blurb: "Defeat Brock, the Rock-type leader of Pewter Gym, for the Boulder Badge."
    readiness: { ace: ONIX, ace_level: 14 }
    tags: [main]

  # MtMoonB2F.asm, he blocks the corridor to the fossils and the exit.
  # PewterCity.asm keeps the east exit to Route 3 closed until Brock.
  - id: BEAT_MT_MOON_SUPER_NERD
    label: Get through Mt. Moon
    done: { event: EVENT_BEAT_MT_MOON_EXIT_SUPER_NERD }
    requires: [BEAT_BROCK]
    map: MT_MOON_B2F
    target: { npc: SUPER_NERD }
    blurb: "Take Route 3 east to Mt. Moon and beat the Super Nerd guarding the fossils on the bottom floor."
    tags: [main]

  - id: REACH_CERULEAN
    label: Reach Cerulean City
    done: { visited: CERULEAN_CITY }
    requires: [BEAT_MT_MOON_SUPER_NERD]
    map: CERULEAN_CITY
    blurb: "Leave Mt. Moon and follow Route 4 east to Cerulean City."
    tags: [main]

  # CeruleanCity.asm, triggered at CeruleanCityCoords2 on the way north
  - id: BEAT_CERULEAN_RIVAL
    label: Beat the rival
    done: { event: EVENT_BEAT_CERULEAN_RIVAL }
    requires: [REACH_CERULEAN]
    map: CERULEAN_CITY
    target: { tile: [20, 6] }
    blurb: "Your rival waits at the north end of Cerulean City, by the bridge to Route 24."
    tags: [main]

  # Route24.asm, set after the five bridge trainers and the Rocket
  - id: CROSS_NUGGET_BRIDGE
    label: Cross Nugget Bridge
    done: { event: EVENT_BEAT_ROUTE24_ROCKET }
    requires: [BEAT_CERULEAN_RIVAL]
    map: ROUTE_24
    target: { npc: COOLTRAINER_M1 }
    blurb: "Beat the five trainers on Nugget Bridge north of Cerulean, then the man who hands out the Nugget."
    tags: [main]

  # BillsHouse.asm, BillsHousePokemonEntersMachineScript
  - id: MEET_BILL
    label: Meet Bill
    done: { event: EVENT_BILL_SAID_USE_CELL_SEPARATOR }
    requires: [CROSS_NUGGET_BRIDGE]
    map: BILLS_HOUSE
    target: { npc: BILL_POKEMON }
    blurb: "Follow Route 25 east to Bill's cottage and talk to the Pokemon inside, it is Bill."
    tags: [main]

  # engine/events/hidden_events/bills_house_pc.asm, a hidden event at (1, 4)
  - id: USE_CELL_SEPARATOR
    label: Run the Cell Separator
    done: { event: EVENT_USED_CELL_SEPARATOR_ON_BILL }
    requires: [MEET_BILL]
    map: BILLS_HOUSE
    target: { tile: [1, 4] }
    blurb: "Use Bill's PC in the top left of the cottage to run the Cell Separator."
    tags: [main]

  # BillsHouse.asm, BillsHouseBillSSTicketText
  - id: GET_SS_TICKET
    label: Get the S.S. Ticket
    done: { any: [{ event: EVENT_GOT_SS_TICKET }, { item_anywhere: S_S_TICKET }] }
    requires: [USE_CELL_SEPARATOR]
    map: BILLS_HOUSE
    target: { npc: BILL1 }
    blurb: "Talk to Bill after he is back to normal, he gives you an S.S. Ticket."
    tags: [main]

  # CeruleanGym.asm
  - id: BEAT_MISTY
    label: Beat Misty
    done: { badge: CASCADE }
    requires: [REACH_CERULEAN]
    map: CERULEAN_GYM
    target: { npc: MISTY }
    blurb: "Defeat Misty, the Water-type leader of Cerulean Gym, for the Cascade Badge."
    readiness: { ace: STARMIE, ace_level: 21 }
    tags: [main]

  # CeruleanCity.asm. The south and east of Cerulean are only reachable
  # through the robbed house and its backyard. CERULEANCITY_GUARD2 blocks the
  # house door until Bill hands out the S.S. Ticket (BillsHouse.asm hides
  # him), and the backyard is three tiles high with the battle triggered at
  # (30, 7) and (30, 9) next to the Rocket at (30, 8).
  - id: BEAT_CERULEAN_ROCKET
    label: Beat the Rocket thief
    done: { event: EVENT_BEAT_CERULEAN_ROCKET_THIEF }
    requires: [GET_SS_TICKET]
    map: CERULEAN_CITY
    target: { npc: ROCKET }
    blurb: "With the police officer gone, walk through the robbed house in Cerulean and beat the Team Rocket thief in its backyard."
    tags: [main]

  # wTownVisitedFlag is set by MarkTownVisitedAndLoadToggleableObjects.
  # Route 5 south of Cerulean, Underground Path, Route 6.
  - id: REACH_VERMILION
    label: Reach Vermilion City
    done: { visited: VERMILION_CITY }
    requires: [BEAT_CERULEAN_ROCKET]
    map: VERMILION_CITY
    blurb: "From the backyard of the robbed house go south out of Cerulean on Route 5, take the Underground Path to Route 6 and on to Vermilion City."
    tags: [main]

  # SSAnneCaptainsRoom.asm. The rival on SS_ANNE_2F has no event flag, only
  # wSSAnne2FCurScript and TOGGLE_SS_ANNE_2F_RIVAL (hidden before and after).
  - id: GET_HM01
    label: Get HM01 Cut
    done: { any: [{ event: EVENT_GOT_HM01 }, { item_anywhere: HM_CUT }] }
    requires: [REACH_VERMILION]
